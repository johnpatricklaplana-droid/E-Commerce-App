<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seller signup</title>
</head>
<body>
    <div class="
        h-screen w-screen bg-blue-950 flex items-center justify-center
    ">
        <form action="" class="
            bg-blue-900 flex flex-col p-3 w-2xl gap-1.5 h-125 overflow-auto
            [scrollbar-width:none]
        ">
            <h1 class="text-white text-center text-lg sm:text-2xl font-bold">Create
                <span class="text-orange-600 text-lg sm:text-2xl font-bold tracking-wide text-center">
                    ShopEase
                </span>
                account
            </h1>

            <label class="text-gray-300" for="first_name">First Name</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" id="first_name" type="text" placeholder="First name">
            <label class="text-gray-300" for="">Last Name</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Last name">
            <label class="text-gray-300" for="">Street</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Street">
            <label class="text-gray-300" for="">City</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="City">
            <label class="text-gray-300" for="">Province</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Province">
            <label class="text-gray-300" for="">Postal code</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Postal code">
            <label class="text-gray-300" for="">Country</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Country">
            <label class="text-gray-300" for="">Email</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Email">
            <label class="text-gray-300" for="">Password</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="Password">
            <label class="text-gray-300" for="">National id</label>
            <input class="border border-gray-300 p-2.5 placeholder:text-gray-300 text-gray-300 outline-0" type="text" placeholder="National id">
            <select class="bg-gray-400 text-white p-2.5 outline-0" name="" id="">
                <option value="Savings Accounts">Savings Accounts</option>
                <option value="Money Market Accounts">Money Market Accounts</option>
                <option value="Certificates of Deposit">Certificates of Deposit</option>
                <option value="Fixed Deposit Accounts">Fixed Deposit Accounts</option>
            </select>
              
            <div class="flex justify-around">
                <label for="imageUpload" class="
                                border-gray-400 border-dashed cursor-pointer border-2
                                py-1.5 min-h-72 w-2xs flex justify-center 
                            ">
                    <img id="preview" class="hidden w-full h-full object-cover" alt="">
                
                    <div id="placeholder" class="flex flex-col justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                            class="w-10 h-10 text-gray-400">
                
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4z" />
                
                            <circle cx="9" cy="9" r="1.5" />
                
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 17l5-5 4 4 3-3 4 4" />
                        </svg>
                        <span class="text-gray-400">Upload image</span>
                    </div>
                </label>
                
                <input class="hidden" type="file" name="" id="imageUpload">
                <label for="imageUpload" class="
                                border-gray-400 border-dashed cursor-pointer border-2
                                py-1.5 min-h-72 w-2xs flex justify-center 
                            ">
                    <img id="preview" class="hidden w-full h-full object-cover" alt="">
                
                    <div id="placeholder" class="flex flex-col justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                            class="w-10 h-10 text-gray-400">
                
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4z" />
                
                            <circle cx="9" cy="9" r="1.5" />
                
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 17l5-5 4 4 3-3 4 4" />
                        </svg>
                        <span class="text-gray-400">Upload file</span>
                    </div>
                </label>
                
                <input class="hidden" type="file" name="" id="imageUpload">
            </div>
            
        </form>
    </div>

    <script type="module" src="/src/pages/seller_signup.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
